# 保活:每 4 小时用无头浏览器真实访问 app(休眠阈值 12h,留 3 倍冗余)。
# 纯 HTTP ping 无效(平台按 WebSocket 会话计活跃),必须真实浏览器,见 scripts/keepalive.py。
name: keep-alive

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

env:
  APP_URL: https://china-eu-monitor.streamlit.app/

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps
      - name: Visit app (wake if sleeping)
        run: python scripts/keepalive.py "$APP_URL"
